name: Daily Stock Analysis

on:
  schedule:
    - cron: "0 7 * * *" # 日本時間 16:00
  workflow_dispatch:

# --- ここを追加：Node.js 24への強制移行に対応 ---
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
# ----------------------------------------------

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install pandas yfinance plotly

      - name: Run Analysis
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_PASS: ${{ secrets.GMAIL_PASS }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
          GH_PAGES_URL: ${{ secrets.GH_PAGES_URL }} # ← これを追加
        run: python RunAll.py

      - name: Prepare for Deployment
        # 08_CreateDashboard.py で生成された Dashboard.html などを公開用フォルダにまとめます
        run: |
          mkdir -p public/visualized_charts
          if [ -f "Dashboard.html" ]; then cp Dashboard.html public/; fi[cite: 3]
          if [ -d "visualized_charts" ]; then cp -r visualized_charts/* public/visualized_charts/; fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
