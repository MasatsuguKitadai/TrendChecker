name: Daily Stock Analysis

on:
  schedule:
    - cron: "0 7 * * *" # 日本時間 16:00
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        # ★ LINE通知に必要な requests を追加
        run: |
          pip install pandas yfinance plotly requests

      - name: Send LINE Notification
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          GH_PAGES_URL: ${{ secrets.GH_PAGES_URL }}
        run: python 09_SendLine.py

      - name: Prepare for Deployment
        run: |
          mkdir -p public/visualized_charts
          if [ -f "Dashboard.html" ]; then cp Dashboard.html public/; fi
          if [ -d "visualized_charts" ]; then cp -r visualized_charts/* public/visualized_charts/; fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
