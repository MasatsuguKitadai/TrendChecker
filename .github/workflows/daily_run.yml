name: Daily Stock Analysis

on:
  schedule:
    # 日本時間の15:47は、UTC（協定世界時）の06:47です (JST - 9時間 = UTC)
    - cron: "47 6 * * *"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write # リポジトリへのPushとGitHub Pagesへのデプロイに必須の権限

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install pandas yfinance plotly requests

      - name: Run All Analysis
        # RunAll.py が 03 -> 07 -> 04 -> 08 を順番に実行します
        run: python RunAll.py

      # 1. 生成されたファイル（Dashboard.html等）をリポジトリに保存（Push）してPagesのビルドをトリガー
      - name: Commit and Push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .
          # 変更があった場合のみコミット＆プッシュを実行する（エラー回避のため）
          if ! git diff --cached --quiet; then
            git commit -m "Update analysis results [skip ci]"
            git push
          fi

      # 2. 【追加】GitHub PagesのHTMLビルド・デプロイ完了を2分間待つ
      - name: Wait for GitHub Pages deployment
        run: |
          echo "GitHub Pagesのビルド完了を待つため、2分間（120秒）スリープします..."
          sleep 120

      # 3. 【位置変更】2分待機した後にLINE通知を送信する
      - name: Send LINE Notification
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          GH_PAGES_URL: ${{ secrets.GH_PAGES_URL }}
        run: python 07_SendLINE.py

      - name: Prepare for Deployment
        run: |
          mkdir -p public/visualized_charts
          if [ -f "Dashboard.html" ]; then cp Dashboard.html public/; fi
          if [ -d "visualized_charts" ]; then cp -r visualized_charts/* public/visualized_charts/; fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
