name: Daily Stock Analysis

on:
  schedule:
    - cron: "0 7 * * *" # 日本時間 16:00
  workflow_dispatch: # 手動実行ボタン用

# 1. 権限エラー(Exit code 128)の修正：書き込み権限を明示的に許可
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 2. バージョン更新：Node.js警告への対応（v3 -> v4, v4 -> v5）
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install pandas yfinance plotly

      - name: Run Analysis
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_PASS: ${{ secrets.GMAIL_PASS }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
        run: python RunAll.py

      # 3. 入力エラーの修正：公開用フォルダを作成してファイルをまとめる
      - name: Prepare for Deployment
        run: |
          mkdir -p public/visualized_charts
          cp Dashboard.html public/
          if [ -d "visualized_charts" ]; then cp -r visualized_charts/* public/visualized_charts/; fi

      # 4. GitHub Pagesへのデプロイ（最新版 v4 を使用）
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public # まとめたフォルダを指定
